services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: doctflow
      POSTGRES_PASSWORD: doctflow123
      POSTGRES_DB: doctflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://doctflow:doctflow123@db:5432/doctflow
    depends_on:
      - db
    volumes:
      - ./doctflow:/app/doctflow
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
